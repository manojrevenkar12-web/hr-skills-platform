version: 1.0.0
owner: compensation
classification: individual
audience: [comp_partner, hr_business_partner]
maxTurns: 6
allowedNumbers: [1, 2, 3, 4, 5]
inputs:
  type: object
  additionalProperties: false
  required: [entity, cycle]
  properties:
    entity: { type: string, minLength: 1 }
    cycle: { type: string, pattern: "^\\d{4}$" }
    orgUnit: { type: string, minLength: 1 }
scripts:
  check_proposals:
    file: scripts/check.ts
    export: checkProposals
    description: "Checks merit proposals against the guideline matrix, band maximums, unit budgets and a same-level, same-rating equity comparison; returns findings with ids."
tools: []
validators: [schema, grounded_numbers, covers_findings, no_invented_findings]
output:
  type: object
  additionalProperties: false
  required: [entity, cycle, summary, findings, notes, findingsAddressed]
  properties:
    entity: { type: string, x-from: check_proposals.entity }
    cycle: { type: string, x-from: check_proposals.cycle }
    summary: { type: array, x-from: check_proposals.summary }
    findings: { type: array, x-from: check_proposals.findings }
    notes:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [orgUnit, note]
        properties:
          orgUnit: { type: string }
          note: { type: string, minLength: 80, maxLength: 3000, x-prose: true }
    findingsAddressed:
      type: array
      items: { type: string, pattern: "^MC-\\d{3}$" }
acceptance:
  golden_pass_rate: 1.0
  fault_catch_rate: 1.0
