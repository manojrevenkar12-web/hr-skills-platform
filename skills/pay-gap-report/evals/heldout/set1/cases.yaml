# Held-out set 1 for pay-gap-report. Written blind from the reference documents only
# (method.md, thresholds.json, job-architecture.yaml, WRITING_HELDOUT.md).
# Hourly pay = hourly + extras / hours; gaps = (men - women) / men x 100, one decimal.
cases:
  # Six women and six men in one category; women about 8% lower (mean 8.1, median 8.2).
  - id: h-pg-001
    build:
      fn: scripts/testkit.ts#company
      rows:
        - { gender: F, hourly: 20 }
        - { gender: F, hourly: 21 }
        - { gender: F, hourly: 22 }
        - { gender: F, hourly: 23 }
        - { gender: F, hourly: 24 }
        - { gender: F, hourly: 26 }
        - { gender: M, hourly: 22 }
        - { gender: M, hourly: 23 }
        - { gender: M, hourly: 24 }
        - { gender: M, hourly: 25 }
        - { gender: M, hourly: 26 }
        - { gender: M, hourly: 28 }
    input: { entity: test-co, year: 2026 }
    expect:
      status: ok
      equals: { indicators.meanGapPct: 8.1, indicators.medianGapPct: 8.2, findings.length: 1, "categories[].suppressed": [false] }

  # Women work part-time at the same hourly rates as men: hourly pay shows no gap although annual pay differs.
  - id: h-pg-002
