      fn: scripts/testkit.ts#company
      rows:
        - { gender: F, hourly: 24, hours: 500 }
        - { gender: F, hourly: 25, hours: 600 }
        - { gender: F, hourly: 26, hours: 700 }
        - { gender: F, hourly: 24, hours: 800 }
        - { gender: F, hourly: 25, hours: 500 }
        - { gender: F, hourly: 26, hours: 1000 }
        - { gender: M, hourly: 24 }
        - { gender: M, hourly: 25 }
        - { gender: M, hourly: 26 }
        - { gender: M, hourly: 24 }
        - { gender: M, hourly: 25 }
        - { gender: M, hourly: 26 }
    input: { entity: test-co, year: 2026 }
    expect:
      status: ok
      equals: { indicators.meanGapPct: 0, indicators.medianGapPct: 0, findings.length: 0 }

